      <article class="lesson-article">
        <section id="topico-abordagem" class="content-block intro-block"><span class="block-number">01 / INTRODUÇÃO</span><h2>O olhar para as pessoas</h2><p>A lousa apresenta a <strong>Teoria das Relações Humanas</strong>, associada a <strong>George Elton Mayo</strong>, e resume sua abordagem como <strong>ênfase nas pessoas</strong>.</p></section>
