      <article class="lesson-article">
        <section id="topico-abordagem" class="content-block intro-block"><span class="block-number">01 / INTRODUÇÃO</span><h2>O olhar para as pessoas</h2><p>A lousa apresenta a <strong>Teoria das Relações Humanas</strong>, associada a <strong>George Elton Mayo</strong>, e resume sua abordagem como <strong>ênfase nas pessoas</strong>.</p></section>
        <section id="topico-adaptacao" class="content-block"><span class="block-number">02 / TRABALHO</span><h2>Trabalho e adaptação</h2><ul><li>Análise do trabalho e adaptação do trabalhador.</li><li>A adaptação do trabalho.</li></ul></section>
        <section id="topico-fatos" class="content-block"><span class="block-number">03 / CONTEXTO</span><h2>Fatos marcantes</h2><ul><li>Necessidade de humanizar e democratizar.</li><li>Desenvolvimento das ciências humanas.</li><li>Ideias filosóficas de Kurt Lewin.</li><li>Conclusões da experiência de Hawthorne.</li></ul></section>
        <section id="topico-funcoes" class="content-block"><span class="block-number">04 / ORGANIZAÇÃO INDUSTRIAL</span><h2>Duas funções básicas</h2><div class="function-grid"><div><span>01</span><h3>Função econômica</h3><p>Produzir bens e serviços.</p></div><div><span>02</span><h3>Função social</h3><p>Distribuir satisfações.</p></div></div></section>
        <section id="topico-pontos" class="content-block"><span class="block-number">05 / ELTON MAYO</span><h2>Pontos de vista</h2><ol><li>O trabalho é uma atividade grupal.</li><li>O operário não reage isoladamente.</li><li>“A administração tem uma tarefa básica...” <span class="uncertain">Trecho parcialmente encoberto na foto.</span></li><li>Necessidade de “estar junto”. Ser reconhecido?</li><li>Fábrica como uma unidade social.</li></ol></section>
        <section id="topico-conflito" class="content-block"><span class="block-number">06 / OUTRO TEMA</span><h2>Conflito social</h2><p>O tema consta da lousa sem uma explicação visível nas fotos.</p></section>
        <div class="transcription-note"><strong>Sobre a transcrição</strong><p>As partes repetidas das fotos foram reunidas e as abreviações, padronizadas. O item sobre a tarefa básica da administração aparece encoberto. Após “fábrica como uma unidade social” há uma palavra de leitura incerta, possivelmente “Futuro?”.</p></div>
